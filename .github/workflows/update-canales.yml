name: Update channels from sources
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-channels:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install axios cheerio

      - name: Run channel scraper
        run: node update-canales.mjs
        env:
          BASE_URL: https://embed.saohgdasregions.fun/

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data1.json
          git commit -m "chore: update channels from sources" || echo "No changes"
          git push
