name: Update embed links in data1.json

"on":
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: embed-updater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # Opcional: asegurar que data1.json existe (si no, crea uno vacío)
      - name: Ensure target file exists
        run: |
          TARGET_FILE="${{ github.workspace }}/${{ vars.EMBED_TARGET_FILE || 'data1.json' }}"
          if [ ! -f "$TARGET_FILE" ]; then
            echo "{}" > "$TARGET_FILE"
            echo "Created empty $TARGET_FILE"
          fi

      - name: Run embed updater
        id: updater
        run: node update-embeds.mjs
        env:
          SOURCE_URL: ${{ vars.EMBED_SOURCE_URL || 'https://embed.saohgdasregions.fun/' }}
          TARGET_FILE: ${{ github.workspace }}/${{ vars.EMBED_TARGET_FILE || 'data1.json' }}

      - name: Commit changes
        if: steps.updater.outputs.changed == 'true'
        env:
          TARGET_FILE: ${{ github.workspace }}/${{ vars.EMBED_TARGET_FILE || 'data1.json' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$TARGET_FILE"
          git commit -m "chore: update embed links (${{ steps.updater.outputs.domain }})"
          git push
